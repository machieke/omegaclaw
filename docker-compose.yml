services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    volumes:
      - ollama-data:/root/.ollama:rw
    networks:
      - appnet

  mettaclaw:
    build:
      context: .
      dockerfile: Dockerfile
    image: mettaclaw:secure
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-ollama-local}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-aiasistentworld/Llama-3.1-8B-Instruct-STO-Master:latest}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      OLLAMA_AUTO_PULL: ${OLLAMA_AUTO_PULL:-true}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:--1}
      OLLAMA_CHAT_STREAM: ${OLLAMA_CHAT_STREAM:-false}
      OLLAMA_PREWARM: ${OLLAMA_PREWARM:-true}
      OLLAMA_THINK: ${OLLAMA_THINK:-false}
      OLLAMA_NUM_PREDICT_CAP: ${OLLAMA_NUM_PREDICT_CAP:-64}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-512}
      OLLAMA_TEMPERATURE: ${OLLAMA_TEMPERATURE:-0.0}
      OLLAMA_DIRECT_NUM_PREDICT: ${OLLAMA_DIRECT_NUM_PREDICT:-12}
      OLLAMA_DIRECT_PROMPT_PREFIX: "${OLLAMA_DIRECT_PROMPT_PREFIX:-One-word answer if possible:}"
      OLLAMA_DETAIL_NUM_PREDICT: ${OLLAMA_DETAIL_NUM_PREDICT:-24}
      OLLAMA_DETAIL_PROMPT_PREFIX: "${OLLAMA_DETAIL_PROMPT_PREFIX:-Answer briefly with practical details:}"
      OLLAMA_CREATIVE_NUM_PREDICT: ${OLLAMA_CREATIVE_NUM_PREDICT:-64}
      OLLAMA_CREATIVE_PROMPT_PREFIX: "${OLLAMA_CREATIVE_PROMPT_PREFIX:-Tell a complete short joke/story with a clear ending:}"
      OLLAMA_LONG_FORM_NUM_PREDICT: ${OLLAMA_LONG_FORM_NUM_PREDICT:-128}
      OLLAMA_LONG_FORM_PROMPT_PREFIX: "${OLLAMA_LONG_FORM_PROMPT_PREFIX:-Provide a complete, practical answer with clear structure and concrete details:}"
      OLLAMA_LONG_FORM_CREATIVE_NUM_PREDICT: ${OLLAMA_LONG_FORM_CREATIVE_NUM_PREDICT:-220}
      OLLAMA_LONG_FORM_CREATIVE_PROMPT_PREFIX: "${OLLAMA_LONG_FORM_CREATIVE_PROMPT_PREFIX:-Tell a full, complete joke/story with setup and payoff. End cleanly:}"
      OLLAMA_DIRECT_MAX_USER_CHARS: ${OLLAMA_DIRECT_MAX_USER_CHARS:-120}
      OLLAMA_DIRECT_MAX_USER_WORDS: ${OLLAMA_DIRECT_MAX_USER_WORDS:-16}
      OLLAMA_DIRECT_MAX_REPLIES: ${OLLAMA_DIRECT_MAX_REPLIES:-3}
      METTACLAW_WORKER_POOL_SIZE: ${METTACLAW_WORKER_POOL_SIZE:-3}
      METTACLAW_MAX_SEND_CHARS: ${METTACLAW_MAX_SEND_CHARS:-280}
      METTACLAW_DETAIL_MAX_SEND_CHARS: ${METTACLAW_DETAIL_MAX_SEND_CHARS:-700}
      METTACLAW_CREATIVE_MAX_SEND_CHARS: ${METTACLAW_CREATIVE_MAX_SEND_CHARS:-700}
      METTACLAW_LONG_FORM_MAX_SEND_CHARS: ${METTACLAW_LONG_FORM_MAX_SEND_CHARS:-1800}
      IRC_MAX_MSG_LEN: ${IRC_MAX_MSG_LEN:-360}
      IRC_CHUNK_DELAY_MS: ${IRC_CHUNK_DELAY_MS:-80}
      IRC_RECEIVE_BATCH_SIZE: ${IRC_RECEIVE_BATCH_SIZE:-3}
      IRC_RECEIVE_COALESCE_MS: ${IRC_RECEIVE_COALESCE_MS:-250}
      METTACLAW_LLM_MODE: ${METTACLAW_LLM_MODE:-fast}
      METTACLAW_ASYNC_DISPATCH: ${METTACLAW_ASYNC_DISPATCH:-true}
      METTACLAW_ASYNC_DISPATCH_WORKERS: ${METTACLAW_ASYNC_DISPATCH_WORKERS:-4}
      METTACLAW_ASYNC_DISPATCH_MAX_BATCH: ${METTACLAW_ASYNC_DISPATCH_MAX_BATCH:-8}
      TRACE_PERFORMANCE: ${TRACE_PERFORMANCE:-false}
      CHROMA_DB_PATH: ${CHROMA_DB_PATH:-/PeTTa/repos/mettaclaw/memory/chroma_db}
      CHROMA_COLLECTION: ${CHROMA_COLLECTION:-memories}
    # Run as non-root while matching host bind-mount ownership by default.
    user: "${METTACLAW_UID:-1000}:${METTACLAW_GID:-1000}"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /run:size=16m,mode=755
      - /var/tmp:size=64m,mode=1777
    volumes:
      - ./memory:/PeTTa/repos/mettaclaw/memory:rw
    restart: unless-stopped
    init: true
    networks:
      - appnet

networks:
  appnet:
    driver: bridge

volumes:
  ollama-data:
